name: Build Kingdom Life APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare WEB Bible
        run: |
          mkdir -p app/src/main/assets/web
          unzip -o web_json.zip -d app/src/main/assets/web

            - name: Prepare French Bible
          run: |
          mkdir -p app/src/main/assets/lsg1910 /tmp/lsg1910
          unzip -o lsg1910_json.zip -d /tmp/lsg1910
          find /tmp/lsg1910 -type f -name '*.json' -exec cp {} app/src/main/assets/lsg1910/ \;
          echo "French Bible files found:"
          ls app/src/main/assets/lsg1910 | head
          test -f app/src/main/assets/lsg1910/Genesis.json

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KingdomLife-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
